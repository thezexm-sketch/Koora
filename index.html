<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d16">
  <title>مركز تدريب التريفيا الكروية</title>
  <style>
    :root{
      --bg:#090d16; --card:#131b2e; --line:#1e293b; --panel:#0b1120; --raise:#1a2540;
      --accent:#0284c7; --accent-l:#38bdf8; --text:#f8fafc; --muted:#94a3b8;
      --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b;
    }
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
    body{background:radial-gradient(1100px 560px at 50% -10%,#13203a 0%,var(--bg) 62%) fixed;color:var(--text);min-height:100vh}
    .wrap{max-width:760px;margin:0 auto;padding:16px 14px 48px}
    h1{font-size:clamp(24px,6vw,34px);font-weight:800;color:var(--accent-l);letter-spacing:-.4px}
    h2{font-size:15px;font-weight:700;color:var(--muted);margin:26px 0 10px}
    p.sub{color:var(--muted);font-size:14px;margin-top:6px;line-height:1.7}
    .hero{padding:22px 4px 0;text-align:center}
    .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(2,132,199,.15);border:1px solid rgba(56,189,248,.3);color:var(--accent-l);font-size:12px;padding:5px 12px;border-radius:20px;margin-top:12px;font-weight:600}
    .dot{width:7px;height:7px;background:var(--ok);border-radius:50%;box-shadow:0 0 8px var(--ok)}
    .dot.off{background:var(--warn);box-shadow:0 0 8px var(--warn)}

    .chips{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .chip{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:start;color:var(--text);cursor:pointer;display:block;width:100%;font-weight:700}
    .chip small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:3px}
    .chip.on{border-color:var(--accent-l);background:rgba(2,132,199,.14)}

    .modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .mode{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:start;color:var(--text);cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:132px;transition:transform .12s,border-color .2s}
    .mode:hover{border-color:#2f4a73}.mode:active{transform:scale(.98)}
    .mode b{font-size:17px}.mode span{font-size:12.5px;color:var(--muted);line-height:1.6;font-weight:500}
    .mode em{margin-top:auto;font-style:normal;font-size:12px;color:var(--accent-l);font-weight:700}
    @media(min-width:640px){.chips{grid-template-columns:repeat(4,1fr)}.modes{grid-template-columns:repeat(4,1fr)}}

    .topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .topbar .ttl{flex:1;text-align:center;font-weight:800;color:var(--accent-l);font-size:15px}
    .pill{background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:700;white-space:nowrap}
    .bar{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:16px}
    .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-l));transition:width .35s}
    .stage{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(14px,3.5vw,28px);box-shadow:0 24px 60px rgba(0,0,0,.45)}

    .btn{border:none;border-radius:14px;padding:15px;font-weight:700;font-size:15px;cursor:pointer;color:#fff;transition:opacity .15s,transform .1s;width:100%}
    .btn:active{transform:scale(.98)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .b1{background:var(--accent)}.b2{background:#334155}
    .b3{background:rgba(239,68,68,.14);color:var(--bad);border:1px solid rgba(239,68,68,.3)}
    .b4{background:var(--ok);color:#052e16}
    .btn.small{padding:9px 14px;font-size:13px;width:auto;border-radius:12px}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
    input.ans{width:100%;padding:15px;background:var(--panel);border:1.5px solid #334155;border-radius:14px;color:#fff;font-size:18px;text-align:center;outline:none;margin-bottom:10px}
    input.ans:focus{border-color:var(--accent-l);box-shadow:0 0 14px rgba(56,189,248,.2)}
    .fb{min-height:30px;margin-top:12px;font-weight:700;font-size:15px;text-align:center;line-height:1.6}
    .fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}.fb.info{color:var(--warn)}
    .shake{animation:shake .35s}
    .note{font-size:12px;color:var(--warn);text-align:center;margin-bottom:10px}
    .state{padding:34px 8px;text-align:center;color:var(--muted);font-size:14px}
    .spinner{border:3px solid rgba(255,255,255,.1);border-top-color:var(--accent-l);border-radius:50%;width:28px;height:28px;animation:spin .8s linear infinite;margin:0 auto 12px}

    .tl{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:clamp(10px,3vw,20px);margin-bottom:14px;display:flex;flex-direction:column}
    .club{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#1a2540,#162038);border:1px solid #2b3a58;border-radius:14px;padding:10px 14px}
    .club.new{animation:pop .45s cubic-bezier(.16,1,.3,1) both}
    .logo{width:clamp(46px,10vw,60px);height:clamp(46px,10vw,60px);flex-shrink:0;border-radius:12px;background:#f1f5f9;padding:6px;display:flex;align-items:center;justify-content:center}
    .logo img{max-width:100%;max-height:100%;object-fit:contain}
    .logo.fb2{background:#1e293b;border:1px solid #334155;color:var(--accent-l);font-weight:800;font-size:17px}
    .cinfo{flex:1;min-width:0}
    .cname{font-weight:800;font-size:clamp(15px,3.6vw,19px)}
    .csub{font-size:12px;color:var(--muted);direction:ltr;text-align:start;margin-top:2px}
    .cmeta{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0}
    .num{background:var(--accent);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
    .yrs{font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid #263349;padding:2px 8px;border-radius:20px;direction:ltr;white-space:nowrap}
    .arrow{display:flex;justify-content:center;color:var(--accent-l);padding:3px 0}
    .arrow svg{width:22px;height:24px}
    .club.locked{border-style:dashed;background:transparent;justify-content:center;color:var(--muted);font-weight:700;font-size:14px;padding:15px}

    .prompt{font-weight:800;font-size:clamp(16px,4vw,20px);text-align:center;margin-bottom:14px;line-height:1.6}
    .plist{display:grid;gap:10px;margin-bottom:14px}
    .pcard{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#1a2540,#162038);border:1px solid #2b3a58;border-radius:14px;padding:14px 16px;animation:pop .4s both}
    .pcard b{font-size:17px;flex:1}.pcard small{color:var(--muted);direction:ltr;font-size:12px}
    .pcard span{font-size:12px;background:var(--panel);border:1px solid #263349;padding:2px 9px;border-radius:20px;color:var(--muted)}
    .hint{min-height:22px;text-align:center;font-size:13px;color:var(--warn);margin-bottom:8px;font-weight:700}

    .gtable{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
    .gc{border-radius:12px;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:12.5px;font-weight:700;line-height:1.4;word-break:break-word}
    .gc.corner{background:none}
    .gc.head{background:var(--raise);border:1px solid #2b3a58;color:var(--accent-l)}
    .gc.head small{display:block;color:var(--muted);font-weight:500;font-size:10.5px}
    button.gc{background:var(--panel);border:1.5px dashed #334155;color:var(--muted);font-size:22px;cursor:pointer}
    button.gc.sel{border:1.5px solid var(--accent-l);color:var(--accent-l);box-shadow:0 0 14px rgba(56,189,248,.25)}
    .gc.ok{background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.5);color:#bbf7d0;animation:pop .35s both}
    .gc.ok.help{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.5);color:#fde68a}

    .flip{background:linear-gradient(135deg,#1a2540,#162038);border:1px solid #2b3a58;border-radius:18px;padding:30px 16px;text-align:center;cursor:pointer;margin-bottom:14px;min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:8px}
    .flip b{font-size:clamp(22px,6vw,30px)}.flip small{color:var(--muted);direction:ltr}.flip i{font-style:normal;font-size:12px;color:var(--accent-l);margin-top:8px}
    .decks{display:grid;gap:10px}

    .sum{text-align:center}
    .big{font-size:52px;font-weight:900;color:var(--accent-l);line-height:1.1}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
    .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
    .stat b{display:block;font-size:20px}.stat small{color:var(--muted);font-size:11.5px}
    .rev{text-align:start;margin:14px 0}
    .rev h3{font-size:14px;color:var(--warn);margin-bottom:8px}
    .ri{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
    .ri small{display:block;color:var(--muted);margin-top:3px;line-height:1.5}
    .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:26px;line-height:1.8}

    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
    @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
    :focus-visible{outline:2px solid var(--accent-l);outline-offset:2px}
  </style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
/* ================= أدوات ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// تطبيع النصوص: يتجاهل الهمزات والتشكيل و"ال" التعريف والمسافات والرموز
function nrm(s) {
  s = String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f\u064B-\u065F\u0640]/g, "");
  s = s.replace(/[أإآٱ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/ؤ/g, "و").replace(/ئ/g, "ي");
  s = s.split(/\s+/).map(w => (w.length > 3 && w.startsWith("ال")) ? w.slice(2) : w).join(" ");
  return s.replace(/[^a-z0-9\u0621-\u064A]/g, "");
}
const baseTitle = t => t.replace(/\s*\(.*\)$/, "");

/* ================= البيانات ================= */
const NAT = {

// [المستوى, عنوان ويكيبيديا, الاسم العربي, مفاتيح الإجابة, الجنسية, الأندية (احتياطي)]

function playerNames(p) {
  if (p._n) return p._n;
  const set = new Set();
  [...(p.keys || []), p.ar, baseTitle(p.wiki)].forEach(k => set.add(nrm(k)));
  [baseTitle(p.wiki).split(/\s+/).pop(), p.ar.split(/\s+/).pop()].forEach(k => { if (nrm(k).length >= 4) set.add(nrm(k)); });
  return (p._n = set);
}
const findPlayer = (guess, pool = PLAYERS) => { const g = nrm(guess); return g ? pool.find(p => playerNames(p).has(g)) || null : null; };
const clubNames = c => { const e = CLUBS[c] || {}; return new Set([c, e.ar, ...(e.al || [])].filter(Boolean).map(nrm)); };
const clubLabel = c => (CLUBS[c] && CLUBS[c].ar) || c;

/* ================= Wikidata API + كاش + بيانات احتياطية ================= */
const WD_API = "https://www.wikidata.org/w/api.php";
const NATIONAL_TYPES = ["Q6979593", "Q1194951", "Q20678767"];
const BAD_ANY = /\b(national|olympic|under[- ]?\d+|U-?\d{2})\b/i;
const BAD_END = /\b(youth|reserves?|juvenil|castilla|academy|II|III|B|C)$/i;
let apiDownUntil = 0;

function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(t));
}
async function wd(params) {
  const res = await fetchWithTimeout(`${WD_API}?${new URLSearchParams({ format: "json", origin: "*", ...params })}`, 9000);
  if (!res.ok) throw new Error("Wikidata " + res.status);
  const d = await res.json();
  if (d.error) throw new Error("Wikidata " + (d.error.info || "error"));
  return d;
}
const yearOf = q => { const t = q?.[0]?.datavalue?.value?.time; const m = t && t.match(/^[+-](\d{4})/); return m ? +m[1] : null; };
function pickLogo(claims) {
  const list = (claims?.P154 || []).filter(c => c.rank !== "deprecated" && c.mainsnak?.datavalue);
  if (!list.length) return null;
  const cur = list.filter(c => !c.qualifiers?.P582);
  const file = (cur.length ? cur : list).slice(-1)[0].mainsnak.datavalue.value;
  return `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(file)}?width=128`;
}
async function resolveEntity(wiki) {
  const p = await wd({ action: "wbgetentities", sites: "enwiki", titles: wiki, normalize: "1", props: "claims" });
  const ent = Object.values(p.entities || {})[0];
  if (ent && ent.missing === undefined && ent.claims?.P54) return ent;
  // لو العنوان مش مظبوط: بحث احتياطي عن أول "footballer"
  const s = await wd({ action: "wbsearchentities", search: baseTitle(wiki), language: "en", type: "item", limit: "8" });
  const cand = (s.search || []).find(x => /footballer|soccer/i.test(x.description || ""));
  if (!cand) throw new Error("Player not found: " + wiki);
  const e = await wd({ action: "wbgetentities", ids: cand.id, props: "claims" });
  return e.entities[cand.id];
}
async function fetchClubsLive(player) {
  const ent = await resolveEntity(player.wiki);
  const spells = (ent.claims?.P54 || [])
    .filter(s => s.rank !== "deprecated" && s.mainsnak?.datavalue?.value?.id)
    .map((s, i) => ({ qid: s.mainsnak.datavalue.value.id, start: yearOf(s.qualifiers?.P580), end: yearOf(s.qualifiers?.P582), i }));
  if (spells.length && spells.every(x => x.start)) spells.sort((a, b) => a.start - b.start || a.i - b.i);
  const ids = [...new Set(spells.map(s => s.qid))], data = {};
  for (let i = 0; i < ids.length; i += 50) {
    const d = await wd({ action: "wbgetentities", ids: ids.slice(i, i + 50).join("|"), props: "labels|claims", languages: "en|ar" });
    Object.assign(data, d.entities);
  }
  const out = [];
  for (const s of spells) {
    const e = data[s.qid], en = e?.labels?.en?.value;
    if (!en) continue;
    const types = (e.claims?.P31 || []).map(c => c.mainsnak?.datavalue?.value?.id);
    if (types.some(t => NATIONAL_TYPES.includes(t)) || BAD_ANY.test(en) || BAD_END.test(en)) continue;
    const item = { en, ar: e.labels?.ar?.value || null, logo: pickLogo(e.claims), start: s.start, end: s.end };
    const last = out[out.length - 1];
    if (last && last.en === item.en) { last.end = item.end; if (!last.start) last.start = item.start; continue; }
    out.push(item);
  }
  if (out.length < 2) throw new Error("Not enough clubs: " + player.wiki);
  return out;
}
const mem = {};
async function getClubs(p) {
  if (mem[p.wiki]) return mem[p.wiki];
  const key = "koora:v2:" + p.wiki, c = store.get(key, null);
  if (c && c.clubs?.length >= 2 && Date.now() - c.t < 30 * 864e5) return (mem[p.wiki] = { clubs: c.clubs, live: true });
  let err;
  if (Date.now() >= apiDownUntil) {
    for (let a = 0; a < 2; a++) {
      try {
        const clubs = await fetchClubsLive(p);
        store.set(key, { t: Date.now(), clubs });
        return (mem[p.wiki] = { clubs, live: true });
      } catch (e) {
        err = e;
        if (/^Player not found|^Not enough/.test(e.message)) break;
        await new Promise(r => setTimeout(r, 500));
      }
    }
    if (err && !/^Player not found|^Not enough/.test(err.message)) apiDownUntil = Date.now() + 45000;
  }
  if (p.clubs) {
    const clubs = p.clubs.filter((c, i, a) => c !== a[i - 1]).map(en => ({ en, ar: CLUBS[en]?.ar || null, logo: null, start: null, end: null }));
    return { clubs, live: false };
  }
  throw err || new Error("offline");
}
function prefetch(list) {
  let i = 0;
  const w = async () => { while (i < list.length) { try { await getClubs(list[i++]); } catch {} } };
  w(); w();
}

/* ================= مولدات الألغاز ================= */
function genLinks(pool, n) {
  const out = [], used = new Set();
  const clubKeys = Object.keys(CLUBS);
  const attempt = (pl) => {
    for (let t = 0; t < 400 && out.length < n; t++) {
      const c = clubKeys[Math.floor(Math.random() * clubKeys.length)];
      if (used.has(c)) continue;
      const cand = pl.filter(p => p.clubs.includes(c));
      if (cand.length < 2) continue;
      const k = Math.min(cand.length, Math.random() < 0.6 ? 3 : 2);
      const chosen = shuffle(cand.slice()).slice(0, k);
      const answers = clubKeys.filter(x => chosen.every(p => p.clubs.includes(x)));
      used.add(c);
      out.push({ players: chosen, answers });
    }
  };
  attempt(pool);
  if (out.length < n) attempt(PLAYERS);
  return out;
}
const sat = (p, cat) => cat.t === "c" ? p.clubs.includes(cat.k) : p.nat === cat.k;
function genGrid() {
  const clubCats = Object.keys(CLUBS).filter(c => PLAYERS.filter(p => p.clubs.includes(c)).length >= 3).map(k => ({ t: "c", k }));
  const natCats = Object.keys(NAT).filter(n => PLAYERS.filter(p => p.nat === n).length >= 2).map(k => ({ t: "n", k }));
  const all = [...clubCats, ...natCats];
  for (let i = 0; i < 6000; i++) {
    const s = shuffle(all.slice()), rows = s.slice(0, 3), cols = s.slice(3, 6);
    if (![...rows, ...cols].some(c => c.t === "n")) continue;
    let ok = true, total = 0;
    for (const r of rows) { for (const c of cols) {
      if (r.t === "n" && c.t === "n") { ok = false; break; }
      const v = PLAYERS.filter(p => sat(p, r) && sat(p, c)).length;
      if (!v) { ok = false; break; }
      total += v;
    } if (!ok) break; }
    if (ok && total >= 11) return { rows, cols };
  }
  return null;
}

  }
  h += "</div>";
  h += S.sel === null ? `<div class="state" style="padding:8px">اضغط على خانة وبعدين اكتب اسم لاعب يحقق الشرطين</div>`
    : `<input class="ans" id="ans" type="text" placeholder="اسم اللاعب..." autocomplete="off" autocapitalize="off" spellcheck="false">
       <div class="row2"><button class="btn b1" data-a="submit">تأكيد</button><button class="btn b2" data-a="reveal">اكشف لاعب (بدون نقاط)</button></div>`;
  h += `<button class="btn b3" data-a="finishGrid">إنهاء الجولة</button>`;
  stage(h); updateTop(); focusAns();
}
const gridFilled = () => S.cells.filter(Boolean).length;
function gridValid(i) { const r = S.grid.rows[Math.floor(i / 3)], c = S.grid.cols[i % 3]; return PLAYERS.filter(p => sat(p, r) && sat(p, c)); }
function gridSubmit() {
  if (S.sel === null) return setFb("اختار خانة الأول", "info");
  const v = $("#ans").value; if (!v.trim()) return;
  const p = findPlayer(v);
  if (!p) return setFb("اللاعب ده مش في قاعدة التدريب (" + PLAYERS.length + " لاعب)", "info");
  if (S.used.has(p.wiki)) return setFb("استخدمت اللاعب ده قبل كده", "info");
  if (!gridValid(S.sel).includes(p)) { S.wrong++; $("#ans").classList.add("shake"); return setFb("اللاعب ده مش مطابق للشرط", "bad"); }
  S.cells[S.sel] = { p, helped: false }; S.used.add(p.wiki); S.score += 3; S.correct++; S.sel = null; S.i = gridFilled();
  setFb(`صحيح! ${p.ar} (+3 نقاط)`, "ok");
  if (gridFilled() === 9) return finish(); gridPaint();
}
function gridReveal() {
  if (S.sel === null) return;
  const opts = gridValid(S.sel).filter(p => !S.used.has(p.wiki)); if (!opts.length) return setFb("مفيش لاعب متاح للخانة دي", "info");
  const p = opts[0], r = S.grid.rows[Math.floor(S.sel / 3)], c = S.grid.cols[S.sel % 3];
  S.cells[S.sel] = { p, helped: true }; S.used.add(p.wiki);
  S.review.push({ t: `${r.t === "c" ? clubLabel(r.k) : NAT[r.k][0]} × ${c.t === "c" ? clubLabel(c.k) : NAT[c.k][0]}`, d: "اللاعب: " + p.ar });
  S.sel = null; S.i = gridFilled(); setFb(""); if (gridFilled() === 9) return finish(); gridPaint();
}
function gridQuit() {
  S.cells.forEach((cell, i) => {
    if (cell) return;
    const r = S.grid.rows[Math.floor(i / 3)], c = S.grid.cols[i % 3];
    S.review.push({ t: `${r.t === "c" ? clubLabel(r.k) : NAT[r.k][0]} × ${c.t === "c" ? clubLabel(c.k) : NAT[c.k][0]}`, d: "أمثلة: " + gridValid(i).slice(0, 3).map(p => p.ar).join("، ") });
  });
  finish();
}

/* ----- الطور 4: بطاقات التعلم ----- */
function cardsMenu() {
  newSession("cards", { total: 0 }); shell("بطاقات التعلم");
  const pl = pool();
  stage(`<div class="prompt">اختار المجموعة</div><div class="decks">
    <button class="chip" data-a="deck" data-k="tier">لاعبو المستوى المختار<small>${pl.length} لاعب — مساراتهم كاملة</small></button>
    ${SQUADS.map(s => `<button class="chip" data-a="deck" data-k="${s.k}">${s.name}<small>${s.players.length} لاعب — تشكيل المباراة النهائية</small></button>`).join("")}</div>`);
  $("#sc").textContent = "";
}
function startDeck(k) {
  let qs;
  if (k === "tier") qs = shuffle(pool().slice());
  else qs = SQUADS.find(s => s.k === k).players.map(([wiki, ar, pos]) => PLAYERS.find(p => p.wiki === wiki) ? Object.assign({}, PLAYERS.find(p => p.wiki === wiki), { pos }) : { wiki, ar, pos, keys: [] });
  newSession("cards", { qs, total: qs.length }); prefetch(qs); cardRound();
}
function cardRound() {
  if (S.i >= S.total) return finish();
  S.flipped = false; updateTop(); setFb("");
  const p = S.qs[S.i];
  stage(`<div class="flip" data-a="flip" role="button" tabindex="0"><b>${esc(p.ar)}</b><small>${esc(baseTitle(p.wiki))}</small>${p.pos ? `<span class="pos" style="color:var(--muted);font-size:13px">${esc(p.pos)}</span>` : ""}<i>اضغط لقلب البطاقة ومعرفة المسار</i></div>
    <p class="sub" style="text-align:center">${S.i + 1} / ${S.total}</p>`);
}
async function cardFlip() {
  if (S.flipped) return; S.flipped = true;
  const id = S.id, p = S.qs[S.i];
  stage(`<div class="state"><div class="spinner"></div>جاري جلب المسار...</div>`);
  try {
    const r = await getClubs(p);
    if (!S || S.id !== id || S.qs[S.i] !== p) return;
    stage(`<div class="prompt">${esc(p.ar)}</div>${r.live ? "" : '<div class="note">وضع احتياطي: بدون شعارات</div>'}
      <div class="tl">${timelineHTML(r.clubs, r.clubs.length, 0, true)}</div>
      <div class="row2"><button class="btn b4" data-a="know">عرفتها ✓</button><button class="btn b3" data-a="again1">راجعها لاحقاً</button></div>`);
  } catch {
    stage(`<div class="state" style="color:var(--bad)">تعذر جلب المسار (مفيش بيانات احتياطية للاعب ده).</div>
      <div class="row2"><button class="btn b2" data-a="flipRetry">إعادة المحاولة</button><button class="btn b3" data-a="again1">راجعها لاحقاً</button></div>`);
  }
}

/* ----- الملخص النهائي ----- */
function finish() {
  const secs = Math.round((Date.now() - S.t0) / 1000);
  let acc;
  if (S.mode === "grid") { const n = S.correct + S.wrong; acc = n ? Math.round(S.correct / n * 100) : 0; }
  else acc = S.total ? Math.round(S.correct / S.total * 100) : 0;
  const isCards = S.mode === "cards";
  if (!isCards) { const k = "koora:best:" + S.mode; if (S.score > store.get(k, 0)) store.set(k, S.score); }
  const mm = Math.floor(secs / 60), ss = String(secs % 60).padStart(2, "0");
  const msg = acc >= 80 ? "أداء ممتاز!" : acc >= 50 ? "كويس، كمّل تدريب" : "محتاج مراجعة، البطاقات هتساعدك";
  app.innerHTML = `<div class="wrap"><div class="stage sum">
    <h1>اكتملت الجولة</h1><p class="sub">${msg}</p>
    ${isCards ? `<div class="big">${S.correct}/${S.total}</div><p class="sub">بطاقات عرفتها</p>` : `<div class="big">${S.score}</div><p class="sub">نقطة</p>`}
    <div class="stats"><div class="stat"><b>${S.correct}${S.mode === "grid" ? "/9" : "/" + S.total}</b><small>إجابات صحيحة</small></div>
      <div class="stat"><b>${acc}%</b><small>الدقة</small></div><div class="stat"><b>${mm}:${ss}</b><small>الوقت</small></div></div>
    ${S.review.length ? `<div class="rev"><h3>نقاط تحتاج مراجعة (${S.review.length})</h3>${S.review.map(r => `<div class="ri">${esc(r.t)}<small>${esc(r.d)}</small></div>`).join("")}</div>` : ""}
    <div class="row2"><button class="btn b1" data-a="start" data-m="${S.mode}">جولة جديدة</button><button class="btn b2" data-a="home">الرئيسية</button></div></div></div>`;
}

/* ----- الأحداث ----- */
const actions = {
  home,
  tier: d => { store.set("koora:tier", d.k === "all" ? "all" : +d.k); home(); },
  start: d => ({ career: startCareer, link: startLink, grid: startGrid, cards: cardsMenu }[d.m])(),
  retry: () => careerRound(),
  skipErr: () => { S.i++; careerRound(); },
  submit: () => {
    if (!S || S.locked) return;
    if (S.mode === "grid") return gridSubmit();
    const el = $("#ans"), v = el.value; if (!v.trim()) return;
    if (S.mode === "career") {
      const p = S.qs[S.i];
      if (playerNames(p).has(nrm(v))) careerEnd(true, careerPts());
      else { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); setFb("غير صحيح، حاول تاني أو اكشف محطة", "bad"); }
    } else if (S.mode === "link") {
      const q = S.qs[S.i], g = nrm(v);
      if (q.answers.some(c => clubNames(c).has(g))) linkEnd(true, Math.max(1, 3 - S.hints));
      else { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); setFb("غير صحيح، جرّب تاني", "bad"); }
    }
  },
  reveal: () => {
    if (!S || S.locked) return;
    if (S.mode === "grid") return gridReveal();
    if (S.mode === "career" && S.shown < S.clubs.length) {
      S.shown++; $("#tl").innerHTML = timelineHTML(S.clubs, S.shown, S.shown - 1);
      if (S.shown >= S.clubs.length) $("#rv").disabled = true;
      setFb(`المحطات المكشوفة: ${S.shown} — النقاط المتاحة: ${careerPts()}`, "info");
    }
  },
  hint: () => {
    if (!S || S.locked || S.mode !== "link") return;
    const c = S.qs[S.i].answers[0]; S.hints++;
    $("#hint").textContent = `يبدأ بحرف: ${c[0].toUpperCase()}${CLUBS[c]?.ar ? " / " + CLUBS[c].ar[0] : ""}`;
  },
  skip: () => {
    if (!S || S.locked) return;
    if (S.mode === "career") careerEnd(false, 0); else if (S.mode === "link") linkEnd(false, 0);
  },
  next: () => { S.i++; ({ career: careerRound, link: linkRound }[S.mode])(); },
  cell: d => { if (S && S.mode === "grid" && !S.cells[+d.i]) { S.sel = +d.i; setFb(""); gridPaint(); } },
  finishGrid: () => gridQuit(),
  deck: d => startDeck(d.k),
  flip: () => cardFlip(),
  flipRetry: () => { S.flipped = false; cardFlip(); },
  know: () => { S.correct++; S.i++; cardRound(); },
  again1: () => { const p = S.qs[S.i]; S.review.push({ t: p.ar, d: p.pos ? "مركزه: " + p.pos : "راجع مساره" }); S.i++; cardRound(); }
};
app.addEventListener("click", e => { const b = e.target.closest("[data-a]"); if (b && actions[b.dataset.a]) actions[b.dataset.a](b.dataset); });
app.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "ans") actions.submit();
  if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("flip")) { e.preventDefault(); actions.flip(); }
});

home();
</script>
</body>
</html>
