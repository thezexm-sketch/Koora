<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تحدي مسار النجوم | Live Wikidata</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --panel: #0b111d;
      --accent: #0284c7;
      --accent-light: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background:
        radial-gradient(900px 400px at 85% -10%, rgba(2,132,199,0.18), transparent 60%),
        var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      width: 100%;
      max-width: 1040px;
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      margin: auto;
    }

    .header { text-align: center; }
    .header h1 {
      font-size: 26px;
      font-weight: 800;
      color: var(--accent-light);
      letter-spacing: -0.5px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(2, 132, 199, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent-light);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      margin: 8px 0 16px 0;
      font-weight: 600;
    }

    .badge-dot {
      width: 7px; height: 7px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: var(--panel);
      padding: 12px 18px;
      border-radius: 12px;
      margin-bottom: 18px;
      border: 1px solid var(--card-border);
      text-align: center;
    }
    .stat-item { display: flex; flex-direction: column; gap: 2px; }
    .stat-label { font-size: 12px; color: var(--text-muted); }
    .stat-val { font-size: 20px; font-weight: 800; }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-items: start;
    }
    @media (min-width: 860px) {
      body { padding: 32px; }
      .app-card { padding: 32px; }
      .layout { grid-template-columns: 1.35fr 1fr; gap: 24px; }
      .control-panel { position: sticky; top: 24px; }
      .career-container { max-height: 70vh; }
    }

    .career-container {
      background: var(--panel);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      min-height: 200px;
      max-height: 54vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      scroll-behavior: smooth;
    }
    .career-container.center { justify-content: center; text-align: center; align-items: center; }

    .club-node {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #172033;
      border: 1px solid #2b3a55;
      border-radius: 14px;
      padding: 10px 14px;
    }
    .club-node.new { animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1); }

    .club-logo {
      width: 48px; height: 48px;
      flex-shrink: 0;
      background: #f1f5f9;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      padding: 6px;
    }
    .club-logo img { width: 100%; height: 100%; object-fit: contain; }
    .club-logo span { color: #0f172a; font-weight: 800; font-size: 18px; }

    .club-info { flex: 1; min-width: 0; text-align: right; }
    .club-name { font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .club-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; direction: ltr; text-align: right; }

    .club-order {
      background: var(--accent);
      color: #fff;
      width: 26px; height: 26px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800;
      flex-shrink: 0;
    }

    .club-node.hidden-node {
      border-style: dashed;
      border-color: #334155;
      background: transparent;
      color: var(--text-muted);
    }
    .club-node.hidden-node .club-logo { background: #1e293b; }
    .club-node.hidden-node .club-logo span { color: var(--accent-light); font-size: 22px; }

    .connector {
      display: flex; justify-content: center;
      height: 26px;
      color: var(--accent-light);
    }
    .connector.new { animation: fadeIn 0.35s ease; }
    .connector svg { height: 100%; }

    .input-wrapper { margin-bottom: 12px; }
    input[type="text"] {
      width: 100%;
      padding: 15px;
      background: var(--panel);
      border: 1.5px solid #334155;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: all 0.2s ease;
    }
    input[type="text"]:focus {
      border-color: var(--accent-light);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    button {
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent-light); outline-offset: 2px; }

    .btn-primary { background: var(--accent); color: white; }
    .btn-secondary { background: #334155; color: white; }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); width: 100%; }

    .hint { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 12px; line-height: 1.7; }

    .feedback-box {
      min-height: 28px;
      margin-top: 10px;
      font-size: 15px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
    }
    .feedback-box.correct { color: var(--success); }
    .feedback-box.wrong { color: var(--danger); }
    .feedback-box.info { color: var(--warning); }

    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-top: 3px solid var(--accent-light);
      border-radius: 50%;
      width: 28px; height: 28px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .club-node.new, .connector.new { animation: none; }
      .career-container { scroll-behavior: auto; }
    }
  </style>
</head>
<body>

  <div class="app-card" id="appCard">
    <div class="header">
      <h1>تحدي مسار النجوم</h1>
      <div class="badge">
        <div class="badge-dot"></div>
        <span>Live API: Wikidata</span>
      </div>
    </div>

    <div class="dashboard">
      <div class="stat-item">
        <span class="stat-label">مجموع النقاط</span>
        <span class="stat-val" id="score">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">المرحلة الحالية</span>
        <span class="stat-val" dir="ltr" id="roundTracker">1 / 10</span>
      </div>
    </div>

    <div class="layout">
      <div class="career-container" id="careerContainer"></div>

      <div class="control-panel">
        <div class="input-wrapper">
          <input type="text" id="playerInput" placeholder="اكتب اسم اللاعب..." autocomplete="off">
        </div>

        <div class="action-grid">
          <button class="btn-primary" id="btnSubmit" onclick="checkAnswer()">تأكيد الإجابة</button>
          <button class="btn-secondary" id="btnReveal" onclick="revealNextClub()">كشف محطة أخرى</button>
        </div>

        <button class="btn-danger" id="btnSkip" onclick="skipPlayer()">تخطي اللاعب</button>

        <div class="feedback-box" id="feedback"></div>
        <div class="hint">كل محطة تكشفها بتقلل نقاط السؤال. الأندية مرتبة من البداية لحد آخر نادي.</div>
      </div>
    </div>
  </div>

  <script>
    // wiki = عنوان صفحة اللاعب على ويكيبيديا الإنجليزية (بنجيب منه بيانات Wikidata)
    const ROSTER = [
      { wiki: "Zlatan Ibrahimović", name: "زلاتان إبراهيموفيتش", keys: ["ابراهيموفيتش", "زلاتان", "ابرا", "ibrahimovic", "zlatan"] },
      { wiki: "Luis Suárez",        name: "لويس سواريز",        keys: ["سواريز", "لويس سواريز", "suarez"] },
      { wiki: "Arjen Robben",       name: "آريين روبين",        keys: ["روبين", "روبن", "ارين روبين", "robben"] },
      { wiki: "Didier Drogba",      name: "ديدييه دروغبا",      keys: ["دروغبا", "دروجبا", "drogba"] },
      { wiki: "Carlos Tevez",       name: "كارلوس تيفيز",       keys: ["تيفيز", "كارلوس تيفيز", "tevez"] },
      { wiki: "Luka Modrić",        name: "لوكا مودريتش",       keys: ["مودريتش", "لوكا مودريتش", "modric"] },
      { wiki: "Mesut Özil",         name: "مسعود أوزيل",        keys: ["اوزيل", "أوزيل", "ozil", "oezil"] },
      { wiki: "Kylian Mbappé",      name: "كيليان مبابي",       keys: ["مبابي", "كيليان مبابي", "mbappe"] },
      { wiki: "Erling Haaland",     name: "إيرلينغ هالاند",     keys: ["هالاند", "هولاند", "haaland"] },
      { wiki: "Lionel Messi",       name: "ليونيل ميسي",        keys: ["ميسي", "ليو", "messi"] },
      { wiki: "Mohamed Salah",      name: "محمد صلاح",          keys: ["صلاح", "محمد صلاح", "salah", "mosalah"] },
      { wiki: "Cristiano Ronaldo",  name: "كريستيانو رونالدو",  keys: ["رونالدو", "كريستيانو", "كريستيانو رونالدو", "ronaldo", "cr7", "cristiano"] },
      { wiki: "Neymar",             name: "نيمار",              keys: ["نيمار", "نيمار جونيور", "neymar"] },
      { wiki: "Karim Benzema",      name: "كريم بنزيما",        keys: ["بنزيما", "بنزيمه", "كريم بنزيما", "benzema"] },
      { wiki: "Robert Lewandowski", name: "روبرت ليفاندوفسكي",  keys: ["ليفاندوفسكي", "ليفاندوسكي", "ليفا", "lewandowski"] },
      { wiki: "Eden Hazard",        name: "إيدين هازارد",       keys: ["هازارد", "ايدين هازارد", "hazard"] },
      { wiki: "Kevin De Bruyne",    name: "كيفين دي بروين",     keys: ["دي بروين", "دي بروني", "كيفين دي بروين", "debruyne", "bruyne"] },
      { wiki: "Gareth Bale",        name: "غاريث بيل",          keys: ["بيل", "جاريث بيل", "غاريث بيل", "bale"] }
    ];

    const ROUNDS_PER_GAME = 10;

    let rounds = [];
    let currentIndex = 0;
    let score = 0;
    let revealedCount = 2;
    let loadedClubs = [];
    const clubsCache = {}; // wiki title -> Promise

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function cleanStr(str) {
      return str.trim().toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[أإآ]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/ى/g, 'ي')
        .replace(/[\s\-_'.]/g, '');
    }

    /* ---------------- Wikidata API ---------------- */

    async function fetchJSON(url, ms = 10000, tries = 3) {
      let lastErr;
      for (let i = 0; i < tries; i++) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), ms);
        try {
          const res = await fetch(url, { signal: ctrl.signal });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          if (data.error) throw new Error(data.error.info || "API error");
          return data;
        } catch (e) {
          lastErr = e;
          await new Promise(r => setTimeout(r, 600 * (i + 1)));
        } finally {
          clearTimeout(timer);
        }
      }
      throw lastErr;
    }

    const WD = "https://www.wikidata.org/w/api.php?format=json&origin=*&";
    // منتخبات وفرق الشباب بنستبعدها
    const NATIONAL_TYPES = new Set(["Q6979593", "Q1194951"]);
    const NOT_CLUB_LABEL = /national|olympic|under-\d+|\bU-?\d{2}\b|youth|المنتخب|منتخب/i;

    function claimValue(c) { return c?.mainsnak?.datavalue?.value; }
    function bestClaim(list) {
      if (!list || !list.length) return null;
      return list.find(c => c.rank === "preferred") || list[0];
    }
    function yearOf(time) {
      if (!time) return null;
      const y = parseInt(time.slice(1, 5), 10);
      return y > 0 ? y : null;
    }
    function logoUrl(file) {
      return "https://commons.wikimedia.org/wiki/Special:FilePath/" + encodeURIComponent(file) + "?width=120";
    }

    async function fetchClubs(player) {
      // 1) بيانات اللاعب: كل عضوياته في الأندية (P54)
      const pData = await fetchJSON(
        WD + "action=wbgetentities&sites=enwiki&normalize=1&props=claims&titles=" +
        encodeURIComponent(player.wiki)
      );
      const entity = Object.values(pData.entities || {})[0];
      if (!entity || entity.missing !== undefined) throw new Error("player not found");

      const stints = (entity.claims?.P54 || [])
        .filter(c => c.rank !== "deprecated" && claimValue(c)?.id)
        .map((c, i) => ({
          id: claimValue(c).id,
          start: c.qualifiers?.P580?.[0]?.datavalue?.value?.time || "",
          end: c.qualifiers?.P582?.[0]?.datavalue?.value?.time || "",
          order: i
        }));
      if (!stints.length) throw new Error("no clubs");

      // 2) بيانات الأندية: الاسم (عربي/إنجليزي) + الشعار
      const ids = [...new Set(stints.map(s => s.id))];
      const info = {};
      for (let i = 0; i < ids.length; i += 50) {
        const chunk = ids.slice(i, i + 50);
        const cData = await fetchJSON(
          WD + "action=wbgetentities&props=labels|claims&languages=ar|en&ids=" + chunk.join("|")
        );
        Object.entries(cData.entities || {}).forEach(([id, e]) => {
          const types = (e.claims?.P31 || []).map(c => claimValue(c)?.id);
          const logoClaim = bestClaim(e.claims?.P154) || bestClaim(e.claims?.P8972);
          const logoFile = claimValue(logoClaim);
          info[id] = {
            en: e.labels?.en?.value || "",
            ar: e.labels?.ar?.value || "",
            national: types.some(t => NATIONAL_TYPES.has(t)),
            logo: typeof logoFile === "string" ? logoUrl(logoFile) : null
          };
        });
      }

      // 3) فلترة المنتخبات + ترتيب زمني + دمج التكرار المتتالي
      const sorted = stints
        .filter(s => {
          const c = info[s.id];
          return c && !c.national && !NOT_CLUB_LABEL.test(c.en);
        })
        .sort((a, b) => (a.start || "").localeCompare(b.start || "") || a.order - b.order);

      const clubs = [];
      sorted.forEach(s => {
        const c = info[s.id];
        const last = clubs[clubs.length - 1];
        if (last && last.id === s.id) {
          last.endYear = yearOf(s.end) || last.endYear;
          return;
        }
        clubs.push({
          id: s.id,
          name: c.ar || c.en,
          nameEn: c.ar ? c.en : "",
          logo: c.logo,
          startYear: yearOf(s.start),
          endYear: yearOf(s.end)
        });
      });

      if (clubs.length < 2) throw new Error("not enough clubs");
      return clubs;
    }

    function getClubs(player) {
      if (!clubsCache[player.wiki]) {
        clubsCache[player.wiki] = fetchClubs(player).catch(err => {
          delete clubsCache[player.wiki]; // نسمح بإعادة المحاولة
          throw err;
        });
      }
      return clubsCache[player.wiki];
    }

    function prefetchNext() {
      for (let k = 1; k <= 2; k++) {
        const p = rounds[currentIndex + k];
        if (p) getClubs(p).catch(() => {});
      }
    }

    /* ---------------- واجهة اللعبة ---------------- */

    const container = document.getElementById("careerContainer");

    function yearsText(c) {
      if (!c.startYear && !c.endYear) return "";
      if (c.startYear && c.endYear && c.startYear !== c.endYear) return `${c.startYear} – ${c.endYear}`;
      if (c.startYear && !c.endYear) return `${c.startYear} – ...`;
      return String(c.startYear || c.endYear);
    }

    function makeLogo(club) {
      const wrap = document.createElement("div");
      wrap.className = "club-logo";
      const fallback = () => {
        wrap.textContent = "";
        const s = document.createElement("span");
        s.textContent = (club.nameEn || club.name || "?").trim().charAt(0).toUpperCase();
        wrap.appendChild(s);
      };
      if (club.logo) {
        const img = document.createElement("img");
        img.alt = "";
        img.loading = "lazy";
        img.onerror = fallback;
        img.src = club.logo;
        wrap.appendChild(img);
      } else {
        fallback();
      }
      return wrap;
    }

    function makeConnector(isNew) {
      const d = document.createElement("div");
      d.className = "connector" + (isNew ? " new" : "");
      d.innerHTML = '<svg viewBox="0 0 18 26" width="18" height="26" aria-hidden="true"><path d="M9 1v19M3 14l6 8 6-8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      return d;
    }

    function renderClubsList(animateFrom = -1) {
      container.className = "career-container";
      container.innerHTML = "";

      loadedClubs.slice(0, revealedCount).forEach((club, idx) => {
        const isNew = idx >= animateFrom && animateFrom >= 0;
        if (idx > 0) container.appendChild(makeConnector(isNew));

        const node = document.createElement("div");
        node.className = "club-node" + (isNew ? " new" : "");

        const info = document.createElement("div");
        info.className = "club-info";
        const nm = document.createElement("div");
        nm.className = "club-name";
        nm.textContent = club.name;
        info.appendChild(nm);
        const sub = [club.nameEn, yearsText(club)].filter(Boolean).join("  •  ");
        if (sub) {
          const s = document.createElement("div");
          s.className = "club-sub";
          s.textContent = sub;
          info.appendChild(s);
        }

        const order = document.createElement("div");
        order.className = "club-order";
        order.textContent = idx + 1;

        node.append(makeLogo(club), info, order);
        container.appendChild(node);
      });

      const hidden = loadedClubs.length - revealedCount;
      if (hidden > 0) {
        container.appendChild(makeConnector(false));
        const ph = document.createElement("div");
        ph.className = "club-node hidden-node";
        ph.innerHTML = '<div class="club-logo"><span>؟</span></div>';
        const info = document.createElement("div");
        info.className = "club-info";
        const nm = document.createElement("div");
        nm.className = "club-name";
        nm.textContent = hidden === 1 ? "محطة مخفية واحدة" : `${hidden} محطات مخفية`;
        info.appendChild(nm);
        ph.appendChild(info);
        container.appendChild(ph);
      }

      document.getElementById("btnReveal").disabled = (revealedCount >= loadedClubs.length);
      if (animateFrom >= 0) container.scrollTop = container.scrollHeight;
    }

    async function loadRound() {
      if (currentIndex >= rounds.length) {
        showGameOver();
        return;
      }

      const feedback = document.getElementById("feedback");
      const input = document.getElementById("playerInput");

      input.value = "";
      feedback.innerText = "";
      feedback.className = "feedback-box";
      setControlsState(false);

      container.className = "career-container center";
      container.innerHTML = `
        <div class="spinner"></div>
        <div style="font-size:13px; color:var(--text-muted);">جاري جلب مسار اللاعب من الإنترنت...</div>
      `;

      document.getElementById("roundTracker").innerText = `${currentIndex + 1} / ${rounds.length}`;
      document.getElementById("score").innerText = score;

      try {
        loadedClubs = await getClubs(rounds[currentIndex]);
        revealedCount = Math.min(2, loadedClubs.length);
        setControlsState(true);
        renderClubsList();
        prefetchNext();
      } catch (err) {
        console.error(err);
        container.className = "career-container center";
        container.innerHTML = `
          <div style="color:var(--danger); font-size:14px; padding:10px; line-height:1.8;">
            تعذر جلب بيانات اللاعب في هذه اللحظة.<br>تحقق من اتصال الإنترنت وحاول مجدداً.
          </div>
          <div style="display:flex; gap:8px; justify-content:center;">
            <button class="btn-secondary" style="padding:10px 18px;" onclick="loadRound()">إعادة المحاولة</button>
            <button class="btn-secondary" style="padding:10px 18px;" onclick="skipBroken()">لاعب تاني</button>
          </div>
        `;
      }
    }

    // لو لاعب معين مش راضي يحمل، نبدله بلاعب جديد من اللي مش مستخدمين
    function skipBroken() {
      const used = new Set(rounds.map(r => r.wiki));
      const spare = ROSTER.filter(p => !used.has(p.wiki));
      if (spare.length) {
        rounds[currentIndex] = spare[Math.floor(Math.random() * spare.length)];
      } else {
        rounds.splice(currentIndex, 1);
      }
      loadRound();
    }

    function revealNextClub() {
      if (revealedCount < loadedClubs.length) {
        revealedCount++;
        renderClubsList(revealedCount - 1);
      }
    }

    function checkAnswer() {
      const input = document.getElementById("playerInput").value;
      if (!input.trim()) return;

      const userGuess = cleanStr(input);
      const player = rounds[currentIndex];
      const feedback = document.getElementById("feedback");

      const match = player.keys.some(k => cleanStr(k) === userGuess);

      if (match) {
        const pts = Math.max(1, (loadedClubs.length - revealedCount + 1));
        score += pts;
        document.getElementById("score").innerText = score;
        feedback.innerText = `صحيح! هو ${player.name} (+${pts} نقاط)`;
        feedback.className = "feedback-box correct";
        setControlsState(false);
        setTimeout(() => { currentIndex++; loadRound(); }, 1500);
      } else {
        feedback.innerText = "غير صحيح، حاول ثانية أو اكشف محطة أخرى";
        feedback.className = "feedback-box wrong";
      }
    }

    function skipPlayer() {
      const player = rounds[currentIndex];
      const feedback = document.getElementById("feedback");
      feedback.innerText = `اللاعب هو: ${player.name}`;
      feedback.className = "feedback-box info";
      setControlsState(false);
      setTimeout(() => { currentIndex++; loadRound(); }, 1700);
    }

    function setControlsState(enabled) {
      document.getElementById("btnSubmit").disabled = !enabled;
      document.getElementById("btnReveal").disabled = !enabled;
      document.getElementById("btnSkip").disabled = !enabled;
      document.getElementById("playerInput").disabled = !enabled;
      if (enabled) document.getElementById("playerInput").focus();
    }

    function showGameOver() {
      document.getElementById("appCard").innerHTML = `
        <div class="header" style="margin-bottom:20px;">
          <h1>اكتمل التحدي!</h1>
          <div class="badge"><div class="badge-dot"></div><span>Final Result</span></div>
        </div>
        <div style="background:var(--panel); padding:24px; border-radius:14px; border:1px solid var(--card-border); margin:0 auto 20px; max-width:420px; text-align:center;">
          <div style="font-size:13px; color:var(--text-muted); margin-bottom:6px;">مجموع نقاطك</div>
          <div style="font-size:40px; font-weight:900; color:var(--accent-light);">${score}</div>
        </div>
        <button class="btn-primary" style="width:100%; max-width:420px; margin:0 auto;" onclick="location.reload()">جولة جديدة</button>
      `;
    }

    document.getElementById("playerInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkAnswer();
    });

    // بداية اللعبة: 10 لاعبين عشوائي من القايمة
    rounds = shuffle(ROSTER).slice(0, ROUNDS_PER_GAME);
    getClubs(rounds[0]).catch(() => {}); // تسخين الأول
    loadRound();
  </script>
</body>
</html>
